<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全网资源聚合搜索</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>全网资源聚合搜索</h1>
  <p class="sub">书籍 · 视频 · 音频 · 网盘分享 · 磁力 —— 标注可用性与付费状态</p>
</header>

<div class="search-bar">
  <input id="kw" type="text" placeholder="输入关键词，如：三体 / 郭德纲 / 让子弹飞" autofocus>
  <button id="go">搜 索</button>
  <label class="depth"><input type="checkbox" id="depth"> 深度搜索</label>
</div>

<div class="filters">
  <label><input type="checkbox" data-type="video" checked> 视频</label>
  <label><input type="checkbox" data-type="book" checked> 书籍</label>
  <label><input type="checkbox" data-type="audio" checked> 音频</label>
  <label><input type="checkbox" data-type="netdisk_share" checked> 网盘</label>
  <label><input type="checkbox" data-type="magnet" checked> 磁力</label>
  <label class="intl" title="国际源（Internet Archive / Open Library），需本地配置代理"><input type="checkbox" id="intl"> 国际源</label>
  <label class="free-only"><input type="checkbox" id="freeOnly"> 仅看免费</label>
</div>

<div id="panFilters" class="pan-filters"></div>
<div id="status" class="status"></div>
<div id="results"></div>

<footer>
  <p>仅供个人学习研究 · 不存储任何资源文件，仅索引公开链接 · 版权归权利人所有</p>
</footer>

<script src="app.js"></script>
</body>
</html>
